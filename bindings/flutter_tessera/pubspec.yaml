name: flutter_tessera
description: "Flutter platform-view embedding of the Tessera 3D board-game renderer."
version: 0.2.0
homepage: https://github.com/aloisdeniel/tessera
# Depends on the sibling tessera package by path; not publishable as-is.
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  # The pure-Dart FFI binding. flutter_tessera drives the native-owned engine
  # through this package (Tessera.fromHandle) for the any-thread state calls.
  tessera:
    path: ../dart
  ffi: ^2.1.0
  # Web support: JS interop bindings + the web plugin registrant API. The
  # engine itself ships as an Emscripten/WebGPU wasm module in assets/web/.
  web: ^1.1.0
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: FlutterTesseraPlugin
      ios:
        pluginClass: FlutterTesseraPlugin
      android:
        package: com.tessera.flutter_tessera
        pluginClass: FlutterTesseraPlugin
      web:
        pluginClass: FlutterTesseraWebPlugin
        fileName: flutter_tessera_web.dart

  # The Emscripten/WebGPU engine build, loaded at runtime by the web binding
  # (lib/src/web/tessera_wasm.dart). Built by tools/web/build_web.sh.
  assets:
    - assets/web/tessera_web.js
    - assets/web/tessera_web.wasm
